<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Demo — PAP</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="nav container"><a class="logo" href="home.html"><span class="logo-mark">P</span>PAP Admin</a><div class="nav-links"><a href="home.html">หน้าร้าน</a><a href="products.html">Products</a><a class="active" href="admin.html">Admin</a></div></nav></header><main class="admin-shell container"><div class="section-heading"><div><span class="eyebrow">Local demo dashboard</span><h1>จัดการสินค้า</h1><p>ข้อมูลและรูปถูกเก็บใน localStorage ของ browser นี้เท่านั้น</p></div></div><div class="admin-workspace"><form id="product-form" class="admin-form"><h2>Product Information</h2><input type="hidden" name="id"><input type="hidden" name="currentImage"><div class="field"><label for="image">Product Image</label><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG หรือ WebP ไม่เกิน 1.5 MB</small></div><div class="field"><label for="product-name">Product Name</label><input id="product-name" name="name" required></div><div class="field"><label for="description">Product Description</label><textarea id="description" name="description" required></textarea></div><div class="form-row"><div class="field"><label for="price">Price (บาท)</label><input id="price" name="price" type="number" min="0" step="0.01" required></div><div class="field"><label for="stock">Stock Quantity</label><input id="stock" name="stock" type="number" min="0" step="1" required></div></div><div class="form-row"><div class="field"><label for="category">Category</label><select id="category" name="category"><option>Food</option><option>Treats</option><option>Toys</option><option>Beds</option><option>Grooming</option><option>Clothing</option><option>Accessories</option><option>Health &amp; Care</option><option>Other</option></select></div><div class="field"><label for="pet-type">Pet Type</label><select id="pet-type" name="petType"><option value="cat">Cat</option><option value="dog">Dog</option><option value="both">Both</option></select></div></div><label class="check-field"><input type="checkbox" name="featured"> Featured product</label><div class="form-actions"><button class="button" type="submit">Add Product</button><button id="cancel-edit" class="ghost-button" type="button">Clear</button></div><p id="admin-message" class="status" aria-live="polite"></p></form><aside class="admin-preview"><span class="eyebrow">Live Preview</span><div id="product-preview"></div></aside></div><section class="table-wrap admin-list"><h2>Product List</h2><table><thead><tr><th>Image</th><th>Product</th><th>Category / Pet</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="admin-products"></tbody></table></section></main><script src="js/data.js"></script><script src="js/store.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
